name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# softprops/action-gh-release@v2 needs contents:write to create / update the
# GitHub Release; the default GITHUB_TOKEN has only contents:read so the
# publish step 403'd on the first attempt for v0.1.0-alpha.2.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            sidecar_extra: mlx
            build_sidecar: ./scripts/build-sidecar.sh
            # Empty = Tauri's `targets: "all"` from tauri.conf.json wins
            # (DMG + .app for macOS).
            tauri_bundles: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_extra: cuda
            build_sidecar: pwsh ./scripts/build-sidecar.ps1
            # MSI + NSIS from the conf.
            tauri_bundles: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # No platform-specific extra on Linux: the sidecar's CPU path is
            # the default. We pass `dev` again so the install line below
            # stays well-formed without YAML conditionals; pip dedupes.
            sidecar_extra: dev
            build_sidecar: ./scripts/build-sidecar.sh
            # Skip AppImage in CI: Tauri 2's AppImage bundler runs
            # mksquashfs with xz compression on the entire AppDir, which
            # includes the ~300-500 MB PyInstaller sidecar binary. On the
            # free-tier 2-vCPU ubuntu runner this single step takes 15-25
            # minutes — longer than the rest of the build combined.
            # .deb + .rpm cover Ubuntu/Mint/Debian/Pop/Fedora/RHEL/openSUSE
            # natively. Arch/NixOS users can extract the .deb via dpkg-deb
            # until we add a dedicated AppImage track (probably a separate
            # workflow with caching + xz->gzip override).
            tauri_bundles: "--bundles deb,rpm"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sidecar/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Caches the Cargo registry, git deps, and target/ for the Tauri
      # crate. First run on a new platform is full-cost; every subsequent
      # run trims ~3-5 min off Tauri compilation.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Tauri 2 on Linux needs webkit2gtk-4.1 + GTK + libsoup-3 + librsvg.
      # `rpm` gives us rpmbuild for the .rpm bundler. patchelf isn't used
      # by deb/rpm but stays installed so re-enabling an AppImage track
      # later (see matrix comment) is one config change, not a CI change.
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            rpm

      - name: Install sidecar (with dev + platform extras)
        run: pip install -e "./sidecar[dev,${{ matrix.sidecar_extra }}]"

      - name: Run sidecar tests
        run: pytest sidecar/tests -v

      - name: Build sidecar binary
        run: ${{ matrix.build_sidecar }}

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri bundle
        working-directory: apps/desktop
        run: npm run tauri build -- --target ${{ matrix.target }} ${{ matrix.tauri_bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: llm-chain-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          fail_on_unmatched_files: false
          generate_release_notes: true
