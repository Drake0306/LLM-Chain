# Curated dataset manifest (F-B6).
#
# Each entry describes a known-good fine-tune dataset the sidecar can
# download via huggingface_hub on click. Every entry MUST carry an
# explicit ``license`` field — the picker surfaces it so the user can
# decide before downloading. Don't add anything whose license is
# unclear; the user can always add their own datasets via the
# Workshop or by pasting an HF id directly into the picker.
#
# ``schema`` controls how each row is mapped onto the JSONL chat
# format the trainer consumes. Supported values:
#   - instruction_output: rows have {instruction, [input,] output|response}
#     fields; mapped to user (instruction + optional input) → assistant
#     (response). The Alpaca / Dolly family.
#   - conversations: rows have {conversations: [{from, value}, ...]}
#     where from is "human"/"user"/"gpt"/"assistant"; mapped role-by-
#     role. The ShareGPT / SlimOrca family.
#   - messages: rows already carry {messages: [...]}; passthrough.
#
# ``size_rows`` and ``size_mb`` are advisory — surfaced before the
# download so the user can confirm. They don't have to be exact;
# round-tripped numbers are fine.

datasets:
  - id: dolly-15k
    name: "Databricks Dolly 15k"
    hf_id: databricks/databricks-dolly-15k
    description: >-
      15,011 instruction-following pairs across brainstorming, classification,
      QA, summarisation, and writing tasks. Generated by Databricks employees;
      good general-purpose instruction tuning starter.
    license: "CC BY-SA 3.0"
    license_url: https://creativecommons.org/licenses/by-sa/3.0/
    size_rows: 15011
    size_mb: 13
    schema: instruction_output
    suitable_for: [text-only chat]

  - id: alpaca-cleaned
    name: "Alpaca (cleaned)"
    hf_id: yahma/alpaca-cleaned
    description: >-
      Cleaned variant of the Stanford Alpaca instruction-following dataset
      (52k rows). Useful for general-purpose instruction tuning. Original
      Alpaca was machine-generated from GPT-3.5 — note that adds
      OpenAI's terms on top of the dataset's own license.
    license: "CC BY-NC 4.0 (non-commercial)"
    license_url: https://creativecommons.org/licenses/by-nc/4.0/
    size_rows: 51760
    size_mb: 24
    schema: instruction_output
    suitable_for: [text-only chat]

  - id: oasst1-en
    name: "OpenAssistant Conversations (oasst1, English)"
    hf_id: OpenAssistant/oasst1
    description: >-
      Crowd-sourced multi-turn conversations from the OpenAssistant project,
      filtered to English at download time. Tree-structured data is
      flattened into linear conversations along the highest-rated path.
    license: "Apache 2.0"
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    size_rows: 84437
    size_mb: 110
    schema: oasst_tree
    suitable_for: [text-only chat]
