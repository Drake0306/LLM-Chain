  # ---------- Large (13B+) ----------
  - id: Qwen/Qwen3-32B
    name: Qwen3 32B
    family: Qwen3
    params: 32000000000
    license: Apache-2.0
    modalities: [text]
  - id: allenai/OLMo-2-1124-13B
    name: OLMo 2 13B
    family: OLMo
    params: 13000000000
    license: Apache-2.0
    modalities: [text]
    chat_capable: false
    notes: Base research model — no chat template. Card says research/educational; weights are Apache-2.0.

  # ---------- Multimodal (vision-language) ----------
  # Surfaced when the dataset is JSONL chat-with-images. ModelPicker hides
  # these entries for text-only datasets and vice versa so users don't pair
  # a VLM with a CSV by accident.
  - id: Qwen/Qwen2-VL-2B-Instruct
    name: Qwen2-VL 2B Instruct
    family: Qwen2-VL
    params: 2000000000
    license: Apache-2.0
    modalities: [text, image]
    notes: Vision-language model; pairs with the JSONL chat-with-images dataset format.
  - id: Qwen/Qwen2-VL-7B-Instruct
    name: Qwen2-VL 7B Instruct
    family: Qwen2-VL
    params: 7000000000
    license: Apache-2.0
    modalities: [text, image]

  # ---------- Restricted-license (opt-in) ----------
  # Hidden behind the "Allow restricted-license models" toggle. Each entry
  # carries a license_caveat the UI surfaces inline so users opt in with eyes
  # open.
  - id: meta-llama/Meta-Llama-3-8B-Instruct
    name: Llama 3 8B Instruct
    family: Llama
    params: 8000000000
    license: Llama-Community
    license_caveat: >-
      Meta Llama 3 Community License. Requires accepting Meta's terms on the
      Hugging Face model page before download; commercial use is permitted but
      restricted by the acceptable use policy.
    modalities: [text]
    restricted: true
  - id: google/gemma-2-9b-it
    name: Gemma 2 9B Instruct
    family: Gemma
    params: 9000000000
    license: Gemma-ToU
    license_caveat: >-
      Google Gemma Terms of Use. Requires accepting Google's terms on the
      Hugging Face model page; outputs are subject to the Gemma Prohibited Use
      Policy.
    modalities: [text]
    restricted: true
  - id: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    name: DeepSeek R1 Distill Qwen 7B
    family: DeepSeek
    params: 7000000000
    license: DeepSeek-Model-License
    license_caveat: >-
      DeepSeek Model License. Permitted commercial use with attribution; review
      the use-based restrictions before deploying outputs.
    modalities: [text]
    restricted: true
