[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-chain-sidecar"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "psutil>=5.9",
    "torch>=2.3",
    "pyyaml>=6.0",
    "datasets>=2.18",
    "transformers>=4.40",
    "trl>=0.8",
    "peft>=0.10",
    "accelerate>=0.30",
    "huggingface_hub>=0.23",
    "gguf>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]
cuda = ["bitsandbytes>=0.43"]
mlx = ["mlx>=0.15", "mlx-lm>=0.18"]

[project.scripts]
llm-chain-sidecar = "llm_chain_sidecar.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real training tests gated by hardware (run with -m slow)",
]
# By default, exclude slow tests so the default `pytest` invocation stays fast.
addopts = "-m 'not slow'"

[tool.setuptools.packages.find]
include = ["llm_chain_sidecar*"]

[tool.setuptools.package-data]
llm_chain_sidecar = ["models/data/*.yaml"]
